info:
  name: SEGUNDA PÁGINA DE VIAJES
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/viajes?page=1&size=2"
  params:
    - name: page
      value: "1"
      type: query
    - name: size
      value: "2"
      type: query
  auth:
    type: bearer
    token: "{{usuarioToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
