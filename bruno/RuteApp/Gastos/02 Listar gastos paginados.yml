info:
  name: Listar gastos paginados con filtros
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/gastos/paginados"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
    - name: busqueda
      value: ""
      type: query
      disabled: true
    - name: categoria
      value: TRANSPORTE
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{adminToken}}"
