name: vps
variables:
  - name: baseUrl
    value: https://ruteapp.online
    description: API desplegada en el VPS
  - name: authCorreo
    value: admin@ruteapp.com
    description: Correo de una cuenta del VPS
  - name: authPassword
    value: Prueba123!
    description: Contrasena de la cuenta del VPS
  - name: googleCredential
    value: ""
    description: Google ID token valido
  - name: recoveryToken
    value: ""
    description: Token recibido por correo para restablecer contrasena
  - name: adminToken
    value: ""
    description: JWT de un usuario ADMINISTRADOR
  - name: usuarioToken
    value: ""
    description: JWT de un usuario USUARIO
  - name: agenciaToken
    value: ""
    description: JWT de un usuario AGENCIA
  - name: usuarioId
    value: "1"
    description: ID del usuario usado en las solicitudes
  - name: usuarioCorreo
    value: ""
    description: Correo del usuario usado en busquedas e invitaciones
  - name: usuarioRolId
    value: "1"
    description: ID de un rol no administrador para altas y actualizaciones
  - name: invitadoId
    value: "1"
    description: ID del usuario que recibe una invitacion
  - name: invitadoCorreo
    value: ""
    description: Correo del usuario que recibe una invitacion
  - name: invitadoToken
    value: ""
    description: JWT del usuario invitado para responder la invitacion
  - name: organizadorId
    value: "1"
    description: ID del organizador del viaje
  - name: viajeId
    value: "1"
    description: ID del viaje usado en las solicitudes
  - name: participanteId
    value: "1"
    description: ID del participante usado en las solicitudes
  - name: actividadId
    value: "1"
    description: ID de la actividad usada en las solicitudes
  - name: gastoId
    value: "1"
    description: ID del gasto usado en las solicitudes
  - name: pagadorId
    value: "1"
    description: ID del usuario que paga un gasto
  - name: responsableId
    value: "1"
    description: ID del responsable de una actividad
  - name: rolId
    value: "1"
    description: ID del rol usado en las solicitudes
  - name: telefono
    value: ""
    description: Telefono de prueba en formato internacional
