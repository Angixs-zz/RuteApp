info:
  name: BUSCAR PUEBLA GEOAPIFY
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/lugares/autocompletar?texto=Puebla"
  params:
    - name: texto
      value: Puebla
      type: query
  auth:
    type: bearer
    token: "{{usuarioToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
