info:
  name: Listar usuarios paginados con filtros
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/usuarios/paginados"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
    - name: busqueda
      value: ""
      type: query
      disabled: true
    - name: rol
      value: USUARIO
      type: query
      disabled: true
    - name: activo
      value: "true"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{adminToken}}"
