spring.application.name=ruteapp

spring.datasource.url=jdbc:mysql://localhost:3306/ruteapp_db
spring.datasource.username=TU_USUARIO
spring.datasource.password=TU_CONTRASENA

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=CLAVE_SECRETA
jwt.expiration=86400000

google.client-id=${GOOGLE_CLIENT_ID:}

geoapify.base-url=https://api.geoapify.com
geoapify.api-key=${GEOAPIFY_API_KEY}

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@ruteapp.online}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
