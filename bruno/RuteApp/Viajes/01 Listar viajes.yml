info:
  name: Listar viajes paginados con filtros
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/viajes"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
    - name: busqueda
      value: ""
      type: query
      disabled: true
    - name: estado
      value: PLANIFICACION
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{usuarioToken}}"
