info:
  name: Listar actividades paginadas con filtros
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/actividades/paginadas"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
    - name: busqueda
      value: ""
      type: query
      disabled: true
    - name: estado
      value: PENDIENTE
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{adminToken}}"
