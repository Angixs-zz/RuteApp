info:
  name: Invitar participante por WhatsApp
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/participantes"
  body:
    type: json
    data: |-
      {
        "telefonoUsuario": "9511168398",
        "canalInvitacion": "WHATSAPP",
        "viajeId": {{viajeId}},
        "estadoInvitacion": "PENDIENTE",
        "permisoColaborar": false
      }
  auth:
    type: bearer
    token: "{{usuarioToken}}"
